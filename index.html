<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina's Birthday Countdown</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #050117; 
            color: #ffffff;
            text-align: center;
            font-family: 'Garamond', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050117;
            z-index: 9999; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #password-overlay h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #password-input {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #a064ff;
            background-color: #ffffff;
            color: #000000;
            margin-bottom: 15px;
            text-align: center;
            width: 250px;
        }
        #password-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #a064ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }
        #password-btn:hover { background-color: #8b4be6; }
        #password-error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 1.1rem;
            display: none; 
        }

        #top-nav {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 0;
            text-align: center;
            z-index: 100; 
            background: linear-gradient(to bottom, rgba(5, 1, 23, 0.9) 0%, rgba(5, 1, 23, 0) 100%); 
        }
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            margin: 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #a064ff; 
        }

        .content-container {
            max-width: 90%;
            z-index: 10; 
        }
        #main-text-image {
            display: block;
            margin: 0 auto;
            max-width: 800px; 
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.4)); 
            transition: filter 1s ease; 
        }
        #disco-ball {
            width: 150px; 
            height: auto;
            margin: 20px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.5));
            cursor: pointer; 
            transition: transform 0.2s ease;
        }
        #disco-ball:active { transform: scale(0.9); }

        #countdown-timer {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            font-variant-numeric: tabular-nums; 
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(160, 100, 255, 0.8), 0 0 20px rgba(160, 100, 255, 0.4);
            margin-top: 30px;
        }
        #click-msg {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.2rem; 
            color: #a064ff; 
            display: none; 
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite; 
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #celebration-wrapper {
            display: none; 
            margin-top: 20px;
        }
        #celebration-msg {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        @media (max-width: 600px) {
            #countdown-timer { font-size: 3rem; letter-spacing: 2px; }
            #celebration-msg { font-size: 2rem; }
            #click-msg { font-size: 1rem; }
            .nav-link { font-size: 0.9rem; margin: 0 10px; } 
        }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2>Enter Password</h2>
        <input type="password" id="password-input" placeholder="Type password here...">
        <button id="password-btn">Unlock</button>
        <div id="password-error">Incorrect password. Try again!</div>
    </div>

    <header id="top-nav">
        <a href="index.html" class="nav-link active">Home</a> 
        <a href="memories.html" class="nav-link">Memories</a>
        <a href="message.html" class="nav-link">Message</a>
    </header>
    
    <div class="content-container">
        <img id="main-text-image" src="images/minabday.jpeg" alt="Mina's Birthday Countdown">
        <img id="disco-ball" src="images/discoball.gif" alt="Spinning Disco Ball">
        
        <div id="timer-wrapper">
            <div id="countdown-timer">Loading...</div>
            <div id="click-msg">(Audio syncing...)</div>
        </div>

        <div id="celebration-wrapper">
            <div id="celebration-msg">HAPPY 20th BIRTHDAY, MINA!</div>
        </div>
    </div>

    <audio id="birthday-song" src="images/countdown.mp3" preload="auto"></audio>
    <audio id="fart-sound" src="images/fart.mp3" preload="auto"></audio>

    <script>
        const correctPassword = "grassjelly"; 
        const targetDate = new Date('2026-04-03T13:17:00-05:00').getTime();

        const passwordOverlay = document.getElementById('password-overlay');
        const passwordInput = document.getElementById('password-input');
        const passwordBtn = document.getElementById('password-btn');
        const passwordError = document.getElementById('password-error');
        
        const timerWrapper = document.getElementById('timer-wrapper');
        const countdownDisplay = document.getElementById('countdown-timer');
        const celebrationWrapper = document.getElementById('celebration-wrapper');
        const clickMsgDisplay = document.getElementById('click-msg');
        const textImage = document.getElementById('main-text-image');
        const discoBall = document.getElementById('disco-ball');
        
        const musicPlayer = document.getElementById('birthday-song');
        const fartPlayer = document.getElementById('fart-sound');

        // === NEW STRICT AUDIO LOCKS ===
        let isUnlocked = false; 
        let musicStarted = false;
        const preStartSeconds = 117; 

        // === PASSWORD LOGIC ===
        passwordBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword(); 
        });

        function checkPassword() {
            const guess = passwordInput.value.toLowerCase().trim();
            if (guess === correctPassword) {
                isUnlocked = true; // UNLOCKS THE SITE AUDIO
                passwordOverlay.style.display = 'none';
                
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    // Scenario A: The countdown is ALREADY over. Party right now.
                    musicStarted = true;
                    musicPlayer.currentTime = preStartSeconds;
                    musicPlayer.play().catch(e => {
                        document.body.addEventListener('click', () => { musicPlayer.play(); }, { once: true });
                    });
                    fartPlayer.load();
                } else if (distance <= (preStartSeconds * 1000)) {
                    // Scenario B: We are inside the 1m 57s window! Sync perfectly and play!
                    musicStarted = true;
                    const currentSongTime = preStartSeconds - (distance / 1000);
                    musicPlayer.currentTime = Math.max(0, currentSongTime);
                    musicPlayer.play().catch(e => {
                        // Fallback in case the browser gets stubborn
                        clickMsgDisplay.innerHTML = "(Click anywhere to sync audio)";
                        clickMsgDisplay.style.display = 'block'; 
                        document.body.addEventListener('click', () => {
                            const newDist = targetDate - new Date().getTime();
                            musicPlayer.currentTime = newDist > 0 ? preStartSeconds - (newDist / 1000) : preStartSeconds + (Math.abs(newDist) / 1000);
                            musicPlayer.play();
                            clickMsgDisplay.style.display = 'none'; 
                        }, { once: true });
                    });
                    fartPlayer.load();
                } else {
                    // Scenario C: The countdown is still safely in the future. Just wait.
                    musicPlayer.load(); 
                    fartPlayer.load();
                }
            } else {
                passwordError.style.display = 'block';
                passwordInput.value = ''; 
            }
        }

        // === EASTER EGG LOGIC ===
        discoBall.addEventListener('click', function() {
            fartPlayer.currentTime = 0; 
            fartPlayer.play();
        });

        // === CONFETTI ENGINE ===
        function startConfettiRain() {
            const failsafeEnd = Date.now() + (10 * 60 * 1000); 
            const defaults = { startVelocity: 40, spread: 360, ticks: 100, zIndex: 0, colors: ['#a064ff', '#ffffff', '#e6e6e6'] };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                if (musicPlayer.ended || Date.now() > failsafeEnd) {
                    return clearInterval(interval);
                }
                
                confetti({ ...defaults, particleCount: 60, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount: 60, origin: { x: randomInRange(0.4, 0.6), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount: 60, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 200); 
        }

        // === MAIN TIMER LOOP ===
        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            if (distance > 0) {
                let timeString = "";
                if (days > 0) timeString += days + "d ";
                if (hours > 0 || days > 0) timeString += hours + "h ";
                if (minutes > 0 || hours > 0 || days > 0) timeString += minutes + "m ";
                timeString += seconds + "s ";
                countdownDisplay.innerHTML = timeString;
            }

            // === AUDIO SYNC CHECK ===
            // Note the NEW `isUnlocked` rule: It will NEVER play behind the password wall
            if (isUnlocked && distance <= (preStartSeconds * 1000) && distance > 0 && !musicStarted) {
                musicStarted = true; 
                
                const currentSongTime = preStartSeconds - (distance / 1000);
                musicPlayer.currentTime = Math.max(0, currentSongTime);
                musicPlayer.loop = false; 

                musicPlayer.play().then(() => {
                    clickMsgDisplay.style.display = 'none'; 
                }).catch(error => {
                    clickMsgDisplay.innerHTML = "(Click anywhere to sync audio)";
                    clickMsgDisplay.style.display = 'block'; 
                    
                    document.body.addEventListener('click', () => {
                        const newDistance = targetDate - new Date().getTime();
                        if (newDistance > 0) {
                            musicPlayer.currentTime = preStartSeconds - (newDistance / 1000);
                        } else {
                            musicPlayer.currentTime = preStartSeconds + (Math.abs(newDistance) / 1000);
                        }
                        musicPlayer.play();
                        clickMsgDisplay.style.display = 'none'; 
                    }, { once: true });
                });
            }

            // === ZERO HOUR ===
            if (distance <= 0) {
                clearInterval(countdownInterval); 

                timerWrapper.style.display = 'none'; 
                celebrationWrapper.style.display = 'block'; 
                textImage.style.filter = "drop-shadow(0 0 40px rgba(160, 100, 255, 0.9))"; 

                // ONLY triggers the music here if she is already inside the website. 
                // If the screen is still locked, it waits for the checkPassword function!
                if (isUnlocked && !musicStarted) {
                    musicStarted = true;
                    musicPlayer.currentTime = preStartSeconds;
                    musicPlayer.play().catch(e => {
                        document.body.addEventListener('click', () => { musicPlayer.play(); }, { once: true });
                    });
                }

                startConfettiRain();
            }
        }, 100); 
    </script>
</body>
</html>
