<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina's Birthday Countdown</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #050117; 
            color: #ffffff;
            text-align: center;
            font-family: 'Garamond', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* === PASSWORD OVERLAY STYLES === */
        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050117;
            z-index: 9999; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #password-overlay h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #password-input {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #a064ff;
            background-color: #ffffff;
            color: #000000;
            margin-bottom: 15px;
            text-align: center;
            width: 250px;
        }
        #password-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #a064ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }
        #password-btn:hover { background-color: #8b4be6; }
        #password-error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 1.1rem;
            display: none; 
        }

        /* === NAVIGATION MENU === */
        #top-nav {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 0;
            text-align: center;
            z-index: 100; 
            background: linear-gradient(to bottom, rgba(5, 1, 23, 0.9) 0%, rgba(5, 1, 23, 0) 100%); 
        }
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            margin: 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #a064ff; 
        }

        .content-container {
            max-width: 90%;
            z-index: 10; 
        }
        #main-text-image {
            display: block;
            margin: 0 auto;
            max-width: 800px; 
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.4)); 
            transition: filter 1s ease; 
        }
        #disco-ball {
            width: 150px; 
            height: auto;
            margin: 20px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.5));
            cursor: pointer; 
            transition: transform 0.2s ease;
        }
        #disco-ball:active { transform: scale(0.9); }

        #countdown-timer {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            font-variant-numeric: tabular-nums; 
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(160, 100, 255, 0.8), 0 0 20px rgba(160, 100, 255, 0.4);
            margin-top: 30px;
        }
        #click-msg {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.2rem; 
            color: #a064ff; 
            display: none; 
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite; 
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #celebration-wrapper {
            display: none; 
            margin-top: 20px;
        }
        #celebration-msg {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        @media (max-width: 600px) {
            #countdown-timer { font-size: 3rem; letter-spacing: 2px; }
            #celebration-msg { font-size: 2rem; }
            #click-msg { font-size: 1rem; }
            .nav-link { font-size: 0.9rem; margin: 0 10px; } 
        }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2>Enter Password</h2>
        <input type="password" id="password-input" placeholder="Type password here...">
        <button id="password-btn">Unlock</button>
        <div id="password-error">Incorrect password. Try again!</div>
    </div>

    <header id="top-nav">
        <a href="index.html" class="nav-link active">Home</a> 
        <a href="message.html" class="nav-link">Message</a>
    </header>
    
    <div class="content-container">
        <img id="main-text-image" src="images/minabday.jpeg" alt="Mina's Birthday Countdown">
        <img id="disco-ball" src="images/discoball.gif" alt="Spinning Disco Ball">
        
        <div id="timer-wrapper">
            <div id="countdown-timer">Loading...</div>
            <div id="click-msg">(Audio syncing...)</div>
        </div>

        <div id="celebration-wrapper">
            <div id="celebration-msg">HAPPY 20th BIRTHDAY, MINA!</div>
        </div>
    </div>

    <audio id="birthday-song" src="images/countdown.mp3" preload="auto"></audio>
    <audio id="fart-sound" src="images/fart.mp3" preload="auto"></audio>

    <script>
        const correctPassword = "mina20"; 
        const targetDate = new Date('2026-04-04T00:00:00-05:00').getTime();

        const passwordOverlay = document.getElementById('password-overlay');
        const passwordInput = document.getElementById('password-input');

        const passwordError = document.getElementById('password-error');
        
        const timerWrapper = document.getElementById('timer-wrapper');

        const textImage = document.getElementById('main-text-image');
        const discoBall = document.getElementById('disco-ball');
        
        const musicPlayer = document.getElementById('birthday-song');
        const fartPlayer = document.getElementById('fart-sound');

        let musicStarted = false;
        const preStartSeconds = 117; 

        // === UPDATED PASSWORD LOGIC ===
        passwordBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword(); 
        });

        function checkPassword() {
            const guess = passwordInput.value.toLowerCase().trim();
            if (guess === correctPassword) {
                passwordOverlay.style.display = 'none';
                
                // AS SOON as the password is in, start the background music and loop it!
                musicPlayer.loop = true;
                musicPlayer.play().catch(e => console.log("Waiting for more interaction")); 
                fartPlayer.load();
            } else {
                passwordError.style.display = 'block';
                passwordInput.value = ''; 
            }
        }

        // The fart sound plays completely independently of the music track!
