<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina's Birthday Countdown</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #050117; /* Deep dark background */
            color: #ffffff;
            text-align: center;
            font-family: 'Garamond', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrolling when confetti falls */
        }
        .content-container {
            max-width: 90%;
            z-index: 10; /* Keeps text above the confetti */
        }
        #main-text-image {
            display: block;
            margin: 0 auto;
            max-width: 800px; 
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.4)); /* Subtle purple glow */
            transition: filter 1s ease; 
        }
        #disco-ball {
            width: 150px; 
            height: auto;
            margin: 20px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.5));
        }
        #countdown-timer {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Clean font for numbers */
            font-variant-numeric: tabular-nums; /* Stops numbers from jittering left/right */
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(160, 100, 255, 0.8), 0 0 20px rgba(160, 100, 255, 0.4);
            margin-top: 30px;
        }
        #click-msg {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.2rem; 
            color: #a064ff; 
            display: none; /* Hidden until the 1:57 mark */
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite; /* Makes the text gently fade in and out */
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #celebration-wrapper {
            display: none; /* Hidden until the timer hits exactly 00:00:00 */
            margin-top: 20px;
        }
        #celebration-msg {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        /* Makes everything shrink nicely on mobile phones */
        @media (max-width: 600px) {
            #countdown-timer { font-size: 3rem; letter-spacing: 2px; }
            #celebration-msg { font-size: 2rem; }
            #click-msg { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <img id="main-text-image" src="images/minabday.jpeg" alt="Mina's Birthday Countdown">
        
        <img id="disco-ball" src="images/discoball.gif" alt="Spinning Disco Ball">
        
        <div id="timer-wrapper">
            <div id="countdown-timer">Loading...</div>
            <div id="click-msg">(Click anywhere to allow audio)</div>
        </div>

        <div id="celebration-wrapper">
            <div id="celebration-msg">HAPPY 20th BIRTHDAY, MINA!</div>
        </div>
    </div>

    <audio id="birthday-song" src="images/countdown.mp3" preload="auto"></audio>

    <script>
        // SET TARGET DATE: April 4, 2026 at Midnight. The "-05:00" locks it to Central Time.
        const targetDate = new Date('2026-03-31T17:20:00-05:00').getTime();

        // Connect the HTML elements above to variables so the code can control them
        const timerWrapper = document.getElementById('timer-wrapper');
        const countdownDisplay = document.getElementById('countdown-timer');
        const celebrationWrapper = document.getElementById('celebration-wrapper');
        const clickMsgDisplay = document.getElementById('click-msg');
        const musicPlayer = document.getElementById('birthday-song');
        const textImage = document.getElementById('main-text-image');

        // Audio variables
        let musicStarted = false;
        const preStartSeconds = 117; // Tells the code exactly when to start the song (1m 57s)

        // CONFETTI ENGINE: Custom function that shoots purple/white/silver confetti from the top for 15 seconds
        function startConfettiRain() {
            const duration = 15 * 1000; 
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, colors: ['#a064ff', '#ffffff', '#e6e6e6'] };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                const particleCount = 120 * (timeLeft / duration);
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.4), y: -0.1 } });
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.6, 0.9), y: -0.1 } });
            }, 250);
        }

        // MAIN LOOP: This chunk runs constantly, calculating the time and updating the screen
        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Math to convert total milliseconds into days, hours, minutes, and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // A. UPDATE TIMER VISUALS: Assembles the numbers and pushes them to the screen
            if (distance > 0) {
                let timeString = "";
                if (days > 0) timeString += days + "d ";
                if (hours > 0 || days > 0) timeString += hours + "h ";
                if (minutes > 0 || hours > 0 || days > 0) timeString += minutes + "m ";
                timeString += seconds + "s ";
                countdownDisplay.innerHTML = timeString;
            }

            // B. AUDIO SYNC CHECK: If there is exactly 1:57 left, attempt to start the music
            if (distance <= (preStartSeconds * 1000) && distance > 0 && !musicStarted) {
                musicStarted = true; 
                
                // Calculates exact play position in case the page loaded a few seconds late
                const currentSongTime = preStartSeconds - (distance / 1000);
                musicPlayer.currentTime = Math.max(0, currentSongTime);

                musicPlayer.play().then(() => {
                    clickMsgDisplay.style.display = 'none'; // Music worked, hide warning
                }).catch(error => {
                    // Browser blocked it! Show "Click to allow" message
                    clickMsgDisplay.style.display = 'block'; 
                    
                    // If user clicks anywhere, calculate lost time, skip song forward, and play
                    document.body.addEventListener('click', () => {
                        const newDistance = targetDate - new Date().getTime();
                        if (newDistance > 0) {
                            musicPlayer.currentTime = preStartSeconds - (newDistance / 1000);
                        } else {
                            musicPlayer.currentTime = preStartSeconds + (Math.abs(newDistance) / 1000);
                        }
                        musicPlayer.play();
                        clickMsgDisplay.style.display = 'none'; 
                    }, { once: true });
                });
            }

            // C. ZERO HOUR (MIDNIGHT): What happens when the timer finishes
            if (distance <= 0) {
                clearInterval(countdownInterval); // Stops the timer loop

                // Swaps the timer out for the birthday message and intensifies the purple glow
                timerWrapper.style.display = 'none'; 
                celebrationWrapper.style.display = 'block'; 
                textImage.style.filter = "drop-shadow(0 0 40px rgba(160, 100, 255, 0.9))"; 

                // Fallback: If someone opens the page exactly at midnight, play from the 1:57 mark anyway
                if (!musicStarted) {
                    musicStarted = true;
                    musicPlayer.currentTime = preStartSeconds;
                    musicPlayer.play().catch(e => {
                        document.body.addEventListener('click', () => { musicPlayer.play(); }, { once: true });
                    });
                }

                // Fire the confetti cannons!
                startConfettiRain();
            }
        }, 100); // Runs 10 times a second to ensure audio syncs perfectly
    </script>
</body>
</html>
