<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina's Birthday Countdown</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #050117;
            color: #ffffff;
            text-align: center;
            font-family: 'Garamond', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }
        .content-container {
            max-width: 90%;
            z-index: 10; 
        }
        #main-text-image {
            display: block;
            margin: 0 auto;
            max-width: 800px; 
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.4)); 
            transition: filter 1s ease; 
        }
        #disco-ball {
            width: 150px; 
            height: auto;
            margin: 20px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(160, 100, 255, 0.5));
        }
        #countdown-timer {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-variant-numeric: tabular-nums; 
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(160, 100, 255, 0.8), 0 0 20px rgba(160, 100, 255, 0.4);
            margin-top: 30px;
        }
        #click-msg {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.2rem; 
            color: #a064ff; 
            display: none;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #celebration-wrapper {
            display: none; 
            margin-top: 20px;
        }
        #celebration-msg {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        @media (max-width: 600px) {
            #countdown-timer { font-size: 3rem; letter-spacing: 2px; }
            #celebration-msg { font-size: 2rem; }
            #click-msg { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <img id="main-text-image" src="images/minabday.jpeg" alt="Mina's Birthday Countdown">
        
        <img id="disco-ball" src="images/discoball.gif" alt="Spinning Disco Ball">
        
        <div id="timer-wrapper">
            <div id="countdown-timer">Loading...</div>
            <div id="click-msg">(Click anywhere to allow audio)</div>
        </div>

        <div id="celebration-wrapper">
            <div id="celebration-msg">HAPPY 20th BIRTHDAY, MINA!</div>
        </div>
    </div>

    <audio id="birthday-song" src="images/countdown.mp3" preload="auto"></audio>

    <script>
        // Countdown Time
        const targetDate = new Date('2026-03-31T15:010:00-05:00').getTime();

        // ==========================================================

        const timerWrapper = document.getElementById('timer-wrapper');
        const countdownDisplay = document.getElementById('countdown-timer');
        const celebrationWrapper = document.getElementById('celebration-wrapper');
        const clickMsgDisplay = document.getElementById('click-msg');
        const musicPlayer = document.getElementById('birthday-song');
        const textImage = document.getElementById('main-text-image');

        let musicStarted = false;
        const preStartSeconds = 117; // 1 minute and 57 seconds

        function startConfettiRain() {
            const duration = 15 * 1000; 
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, colors: ['#a064ff', '#ffffff', '#e6e6e6'] };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                const particleCount = 120 * (timeLeft / duration);
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.4), y: -0.1 } });
                confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.6, 0.9), y: -0.1 } });
            }, 250);
        }

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // 1. UPDATE TIMER VISUALS
            if (distance > 0) {
                let timeString = "";
                if (days > 0) timeString += days + "d ";
                if (hours > 0 || days > 0) timeString += hours + "h ";
                if (minutes > 0 || hours > 0 || days > 0) timeString += minutes + "m ";
                timeString += seconds + "s ";
                countdownDisplay.innerHTML = timeString;
            }

            // 2. CHECK IF WE ARE IN THE 1:57 PRE-START WINDOW
            if (distance <= (preStartSeconds * 1000) && distance > 0 && !musicStarted) {
                musicStarted = true; // Prevents this from triggering repeatedly
                
                // Calculate exact play position in case the page loaded slightly late
                const currentSongTime = preStartSeconds - (distance / 1000);
                musicPlayer.currentTime = Math.max(0, currentSongTime);

                musicPlayer.play().then(() => {
                    console.log("Music synced and playing!");
                    clickMsgDisplay.style.display = 'none';
                }).catch(error => {
                    console.log("Browser blocked autoplay. Waiting for user interaction.");
                    clickMsgDisplay.style.display = 'block'; // Ask user to click
                    
                    document.body.addEventListener('click', () => {
                        // Recalculate exactly where the song should be based on when they finally clicked
                        const newDistance = targetDate - new Date().getTime();
                        if (newDistance > 0) {
                            musicPlayer.currentTime = preStartSeconds - (newDistance / 1000);
                        } else {
                            musicPlayer.currentTime = preStartSeconds + (Math.abs(newDistance) / 1000);
                        }
                        musicPlayer.play();
                        clickMsgDisplay.style.display = 'none'; 
                    }, { once: true });
                });
            }

            // 3. ZERO HOUR: MIDNIGHT CELEBRATION
            if (distance <= 0) {
                clearInterval(countdownInterval); 

                // Visual changes
                timerWrapper.style.display = 'none'; 
                celebrationWrapper.style.display = 'block'; 
                textImage.style.filter = "drop-shadow(0 0 40px rgba(160, 100, 255, 0.9))"; 

                // Fallback: If someone opens the page exactly at midnight, start the music at 1:57
                if (!musicStarted) {
                    musicStarted = true;
                    musicPlayer.currentTime = preStartSeconds;
                    musicPlayer.play().catch(e => {
                        document.body.addEventListener('click', () => { musicPlayer.play(); }, { once: true });
                    });
                }

                startConfettiRain();
            }
        }, 100); // Running check every 1/10th of a second for tighter audio sync
    </script>
</body>
</html>
